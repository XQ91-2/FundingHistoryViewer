<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperliquid Funding History</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0e1116;--card:#161b22;--b:#262d37;--t:#e6edf3;--m:#8b949e;--g:#3fb950;--r:#f85149;--a:#58a6ff}
@media(prefers-color-scheme:light){:root{--bg:#f6f8fa;--card:#fff;--b:#d0d7de;--t:#1f2328;--m:#656d76;--g:#1a7f37;--r:#cf222e;--a:#0969da}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:auto}h1{font-size:20px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input,button{background:var(--card);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:7px 10px;font:inherit}
button{cursor:pointer}button.on{border-color:var(--a);color:var(--a)}
.card{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:12px}
.chart{height:380px;position:relative}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--b)}
th:first-child,td:first-child{text-align:left}th{color:var(--m);font-weight:500}
.pos{color:var(--g)}.neg{color:var(--r)}.m{color:var(--m)}
.dd{position:relative}.dd .menu{display:none;position:absolute;z-index:5;top:100%;left:0;margin-top:4px;background:var(--card);border:1px solid var(--b);border-radius:8px;padding:8px;min-width:170px;max-height:320px;overflow:auto}
.dd.open .menu{display:block}.menu label{display:flex;gap:8px;padding:4px 2px;cursor:pointer}
#status{color:var(--m);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>Hyperliquid Funding History</h1>
<div class="bar">
  <input id="search" list="coins" placeholder="Search coin…" style="width:150px">
  <datalist id="coins"></datalist>
  <span id="pair" style="font-weight:600"></span>
  <div id="ranges"></div>
  <button id="mode">APR %</button>
  <div class="dd" id="dd"><button id="ddbtn">Datasets ▾</button><div class="menu" id="menu"></div></div>
  <input id="notional" type="number" min="0" step="1000" placeholder="Notional $" title="Position size in USD" style="width:120px">
  <select id="tz" title="Time zone"></select>
  <button id="csv">CSV</button>
  <button id="clr">Clear cache</button>
  <span id="status"></span>
</div>
<div class="card"><div class="chart"><canvas id="c"></canvas></div></div>
<div class="card" id="earn" style="display:none"></div>
<div class="card"><table id="stats"></table></div>
<div class="m" style="font-size:12px">Data: Hyperliquid public API (fundingHistory). Funding is paid hourly. APR = hourly rate × 24 × 365. Positive = longs pay shorts. Earned = sum of every hourly rate in the window × notional (fixed notional, mark price changes ignored).</div>
</div>
<script>
const API='https://api.hyperliquid.xyz/info', H=3600e3;
const post=b=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const $=id=>document.getElementById(id);
const RANGES={'7D':7,'30D':30,'90D':90,'1Y':365,'All':null};
const AVGS={'24H':1,'3D':3,'7D':7,'14D':14,'30D':30,'3M':90,'6M':182,'1Y':365,'2Y':730,'3Y':1095,'4Y':1460,'5Y':1825};
const SETS={raw:'Funding (avg per bucket)',...Object.fromEntries(Object.keys(AVGS).map(k=>[k,`${k} average`]))};
const PALETTE=['#58a6ff','#39c5cf','#3fb950','#d29922','#f0883e','#f85149','#db61a2','#bc8cff','#79c0ff','#56d364','#e3b341','#ff7b72'];
const colorOf=k=>k==='raw'?'#8b949e':PALETTE[Object.keys(AVGS).indexOf(k)%PALETTE.length];
const TZS={local:'Local time',UTC:'UTC','Europe/Zurich':'Zurich','Europe/London':'London','America/New_York':'New York','America/Los_Angeles':'Los Angeles','Asia/Singapore':'Singapore','Asia/Tokyo':'Tokyo'};
const state={tz:'local',coin:'ETH',range:'7D',apr:true,sets:{raw:true,'30D':true}};
const cache={};let chart,data=[];

async function loadCoins(){
  const [meta]=await post({type:'metaAndAssetCtxs'});
  const live=m=>m.universe.filter(u=>!u.isDelisted).map(u=>u.name).sort();
  let names=live(meta);
  try{ // HIP-3 builder markets (e.g. xyz:NVDA)
    const dexs=(await post({type:'perpDexs'})).filter(Boolean).map(d=>d.name);
    const extra=await Promise.all(dexs.map(d=>post({type:'metaAndAssetCtxs',dex:d}).then(r=>live(r[0])).catch(()=>[])));
    names=names.concat(extra.flat().sort());
  }catch(e){}
  $('coins').innerHTML=names.map(n=>`<option value="${n}">`).join('');
}
const START=Date.UTC(2023,4,1);let info='';
const DB=new Promise((res,rej)=>{try{const q=indexedDB.open('hl-funding',1);q.onupgradeneeded=()=>q.result.createObjectStore('coins');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const idb=async(mode,fn)=>{const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction('coins',mode),r=fn(tx.objectStore('coins'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})};
async function fetchAll(coin){
  if(cache[coin])return cache[coin];
  let rows=[],cached=false;
  try{const rec=await idb('readonly',s=>s.get(coin));
    if(rec){rows=Array.from(rec.times,(t,i)=>[t,rec.rates[i]]);cached=true}}catch(e){}
  const last=rows.length?rows[rows.length-1][0]:START-1;
  let fresh=[];
  if(Date.now()-last>H)fresh=await fetchRange(coin,last+1);
  const m=new Map(rows);fresh.forEach(r=>m.set(r[0],r[1]));
  rows=[...m].sort((a,b)=>a[0]-b[0]);
  info=cached?(fresh.length?`cache + ${fresh.length} new`:'from cache'):'fetched';
  try{await idb('readwrite',s=>s.put({times:Float64Array.from(rows,r=>r[0]),rates:Float64Array.from(rows,r=>r[1]),updated:Date.now()},coin))}catch(e){info+=' (cache unavailable)'}
  return cache[coin]=rows;
}
async function fetchRange(coin,start){
  const now=Date.now(), win=500*H, jobs=[];
  for(let s=start;s<now;s+=win)jobs.push(s);
  let done=0,out=[];
  const worker=async()=>{while(jobs.length){const s=jobs.shift();
    for(let t=0;;t++){try{const r=await post({type:'fundingHistory',coin,startTime:s,endTime:s+win-1});out.push(...r);break}catch(e){if(t>3)throw e;await new Promise(r=>setTimeout(r,500*(t+1)))}}
    $('status').textContent=`Loading… ${++done}`}};
  await Promise.all(Array.from({length:6},worker));
  return out.map(r=>[r.time,+r.fundingRate]);
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
/* EARNINGS CALCULATION
   Hyperliquid pays/charges funding every hour as: payment = notional × that hour's rate.
   So the total over a window is the SUM of (notional × rate) over every hourly payment,
   which equals notional × (sum of all hourly rates). We deliberately do NOT use
   "average rate × hours" or an APR figure: the sum of the real hourly rates is exact,
   including hours where the rate was negative or spiked.
   Always calculated for a SHORT: positive rate = income, negative rate = cost.
   Assumption: the notional stays constant (no compounding, mark price changes ignored). */
const sumRates=(rows,from)=>{let s=0,n=0;for(let i=rows.length-1;i>=0&&rows[i][0]>=from;i--){s+=rows[i][1];n++}return{s,n}};
const notional=()=>Math.max(0,+$('notional').value||0);
const usd=v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const earnedFor=sumOfRates=>sumOfRates*notional();
const TZ=()=>state.tz==='local'?undefined:state.tz;
// UTC offset like "(+2)" or "(+5:30)" for a time zone at a given moment (follows summer/winter time)
const off=(t,z=state.tz)=>{
  const v=new Intl.DateTimeFormat('en-US',{timeZone:z==='local'?undefined:z,timeZoneName:'shortOffset'})
    .formatToParts(new Date(t)).find(x=>x.type==='timeZoneName').value.replace('GMT','');
  return `(${v||'+0'})`;
};
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
// "15th Oct 2026, 20:00" in the selected time zone
function fmtTime(ts,time=true){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:TZ(),day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date(ts)).map(x=>[x.type,x.value]));
  return `${ord(+p.day)} ${p.month} ${p.year}`+(time?`, ${p.hour}:${p.minute}`:'');
}
function rolling(rows,days){const n=days*24,o=[];let sum=0;
  rows.forEach((r,i)=>{sum+=r[1];if(i>=n)sum-=rows[i-n][1];o.push(i>=n-1?sum/n:null)});return o}

function render(){
  const rows=data; if(!rows.length)return;
  const avgSets=Object.keys(AVGS).filter(s=>state.sets[s]);
  const ma=Object.fromEntries(avgSets.map(s=>[s,rolling(rows,AVGS[s])]));
  const days=RANGES[state.range], cut=days?Date.now()-days*86400e3:0;
  const idx=rows.map((r,i)=>i).filter(i=>rows[i][0]>=cut);
  const bucket=Math.max(1,Math.ceil(idx.length/700)), k=state.apr?24*365*100:100;
  const showTime=days&&days<=30, labels=[], ds={raw:[],...Object.fromEntries(avgSets.map(s=>[s,[]]))};
  for(let i=0;i<idx.length;i+=bucket){const sl=idx.slice(i,i+bucket);
    labels.push(fmtTime(rows[sl[0]][0],showTime));
    ds.raw.push(avg(sl.map(j=>rows[j][1]))*k);
    for(const m of avgSets){const v=ma[m][sl[sl.length-1]];ds[m].push(v==null?null:v*k)}}
  const sets=Object.keys(SETS).filter(s=>state.sets[s]).map(s=>({label:SETS[s],data:ds[s],borderColor:colorOf(s),backgroundColor:colorOf(s),borderWidth:s==='raw'?1:2,pointRadius:0,tension:.1,spanGaps:false}));
  if(chart)chart.destroy();
  chart=new Chart($('c'),{type:'line',data:{labels,datasets:sets},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
    scales:{x:{ticks:{maxTicksLimit:10,color:'#8b949e'},grid:{display:false}},y:{ticks:{color:'#8b949e',callback:v=>v.toFixed(state.apr?0:4)+'%'},title:{display:true,text:state.apr?'APR':'% per hour',color:'#8b949e'}}},
    plugins:{legend:{labels:{color:'#8b949e'}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y==null?'—':c.parsed.y.toFixed(state.apr?2:5)+'%'}`}}}}});
  renderStats();
}
function renderStats(){
  const rows=data; if(!rows.length)return;
  const N=notional();
  const last=rows[rows.length-1][0], first=rows[0][0];
  // earnings summary for the currently displayed range
  const days=RANGES[state.range], from=days?Date.now()-days*86400e3:0, {s:rs,n:rn}=sumRates(rows,from);
  const box=$('earn');
  if(N>0){
    const e=earnedFor(rs), perDay=rn?e/(rn/24):0;
    box.style.display='';
    box.innerHTML=`<b>${state.range}</b> · ${usd(N)} short · <b class="${e>=0?'pos':'neg'}">${usd(e)}</b> over ${rn.toLocaleString()} hourly payments (${(rn/24).toFixed(1)} days) · ${usd(perDay)}/day · sum of hourly rates ${(rs*100).toFixed(4)}%`
      +(days&&rn<days*24-24?` <span class="m">(only ${(rn/24).toFixed(1)} days of history exist)</span>`:'');
  }else box.style.display='none';
  let h=`<tr><th>Window</th><th>Avg APR</th><th>Positive</th><th>Earned</th></tr>`;
  for(const [n,d] of Object.entries(AVGS)){
    if(first>last-d*86400e3+H*24){h+=`<tr><td>${n}</td><td colspan=3 class="m">No history</td></tr>`;continue}
    const w=rows.filter(r=>r[0]>=last-d*86400e3).map(r=>r[1]),a=avg(w);
    const sum=w.reduce((x,y)=>x+y,0), e=earnedFor(sum);
    h+=`<tr><td>${n}</td><td class="${a>=0?'pos':'neg'}">${(a*24*365*100).toFixed(2)}%</td><td>${(w.filter(x=>x>0).length/w.length*100).toFixed(0)}%</td><td class="${N>0?(e>=0?'pos':'neg'):'m'}">${N>0?usd(e):'—'}</td></tr>`}
  $('stats').innerHTML=h;
}
function doneMsg(){
  $('status').textContent=data.length?`${data.length.toLocaleString()} hourly points since ${fmtTime(data[0][0])} ${off(data[0][0])} · ${info}`:'No data';
}
async function load(coin){
  state.coin=coin;$('pair').textContent=coin+'-USDC';$('status').textContent='Loading…';
  try{data=await fetchAll(coin);doneMsg();render()}
  catch(e){$('status').textContent='Error: '+e.message}
}
$('ranges').innerHTML=Object.keys(RANGES).map(r=>`<button data-r="${r}">${r}</button>`).join(' ');
$('ranges').onclick=e=>{const r=e.target.dataset.r;if(!r)return;state.range=r;sync();render()};
function sync(){document.querySelectorAll('#ranges button').forEach(b=>b.classList.toggle('on',b.dataset.r===state.range))}
$('mode').onclick=()=>{state.apr=!state.apr;$('mode').textContent=state.apr?'APR %':'Hourly %';render()};
$('menu').innerHTML=Object.entries(SETS).map(([k,v])=>`<label><input type="checkbox" data-s="${k}" ${state.sets[k]?'checked':''}>${v}</label>`).join('');
$('menu').onchange=e=>{state.sets[e.target.dataset.s]=e.target.checked;render()};
$('tz').innerHTML=Object.entries(TZS).map(([k,v])=>`<option value="${k}">${v} ${off(Date.now(),k)}</option>`).join('');
$('tz').onchange=e=>{state.tz=e.target.value;doneMsg();render()};
try{const sv=JSON.parse(localStorage.getItem('hl-earn')||'{}');if(sv.n)$('notional').value=sv.n}catch(e){}
const saveEarn=()=>{try{localStorage.setItem('hl-earn',JSON.stringify({n:$('notional').value}))}catch(e){}renderStats()};
$('notional').oninput=saveEarn;
$('ddbtn').onclick=()=>$('dd').classList.toggle('open');
document.addEventListener('click',e=>{if(!$('dd').contains(e.target))$('dd').classList.remove('open')});
$('search').onchange=e=>{const v=e.target.value.trim();if(v)load(v)};
$('csv').onclick=()=>{if(!data.length)return;const t='time,fundingRate\n'+data.map(r=>new Date(r[0]).toISOString()+','+r[1]).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=state.coin+'-funding.csv';a.click()};
$('clr').onclick=async()=>{try{await idb('readwrite',s=>s.clear())}catch(e){}for(const k in cache)delete cache[k];$('status').textContent='Cache cleared';load(state.coin)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
sync();loadCoins().catch(()=>{});load('ETH');
</script>
</body>
</html>
